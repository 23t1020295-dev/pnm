<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Máy tính cơ bản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-group {
            margin-bottom: 15px;
            display: inline-block;
            vertical-align: top;
        }
        .error {
            color: #d93025;
            font-size: 13px;
            margin-top: 4px;
            display: block;
        }
        .result-box {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #e8f0fe;
            border: 1px solid #c2e7ff;
            display: inline-block;
            font-weight: bold;
            color: #1967d2;
        }
        input[type="text"], select {
            padding: 6px 10px;
            font-size: 15px;
        }
        button {
            padding: 6px 16px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Bài 1 ★. Máy tính cơ bản</h2>

    <form method="POST" action="">
        <div class="form-group">
            <input type="text" name="a" placeholder="Số thứ nhất" value="{{ raw_a }}">
            {% if error_a %}
                <span class="error">{{ error_a }}</span>
            {% endif %}
        </div>

        <div class="form-group">
            <select name="op">
                <option value="+" {% if op == '+' %}selected{% endif %}>+</option>
                <option value="-" {% if op == '-' %}selected{% endif %}>-</option>
                <option value="*" {% if op == '*' %}selected{% endif %}>*</option>
                <option value="/" {% if op == '/' %}selected{% endif %}>/</option>
            </select>
        </div>

        <div class="form-group">
            <input type="text" name="b" placeholder="Số thứ hai" value="{{ raw_b }}">
            {% if error_b %}
                <span class="error">{{ error_b }}</span>
            {% endif %}
        </div>

        <div class="form-group">
            <button type="submit">Tính</button>
        </div>

        {% if general_error %}
            <div>
                <span class="error">{{ general_error }}</span>
            </div>
        {% endif %}
    </form>

    {% if result %}
        <div class="result-box">
            Kết quả: {{ result }}
        </div>
    {% endif %}

</body>
</html>
